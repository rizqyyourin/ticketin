name: Deploy Ticketin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ticketin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /var/www/ticketin
      BRANCH: main
      PM2_APP_NAME: ticketin
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Validate production build
        run: pnpm run build

      - name: Configure SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Required secrets VPS_HOST and/or VPS_SSH_PRIVATE_KEY are not set."
            echo "Please go to Settings → Secrets and variables → Actions and add the required secrets."
            exit 1
          fi
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          : "${VPS_PORT:=22}"
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "export APP_DIR='${APP_DIR}' BRANCH='${BRANCH}' PM2_APP_NAME='${PM2_APP_NAME}'; cd '${APP_DIR}' && bash scripts/deploy-vps.sh"
